# Keeps the SHA-pinned actions in .github/workflows current: one grouped PR a month,
# for releases at least a week old (the same wait as minimumReleaseAge for npm).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
