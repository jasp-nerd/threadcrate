# Sends a published release to the Chrome Web Store, after jasp approves the store-submit environment.
# Firefox Add-ons and Edge Add-ons join once their ids are set as repository variables
# (FIREFOX_EXTENSION_ID, EDGE_PRODUCT_ID): launch is Chrome only.
# Uses the exact zips release.yml built and attested; never rebuilds them.
# Not for 0.1.0: the first version goes to each store by hand (docs/releasing.md). Reject the deployment then.
name: Submit to stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, like v0.2.0
        required: true
      dry_run:
        description: Check everything, submit nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency: store-submit

jobs:
  submit:
    runs-on: ubuntu-24.04
    environment: store-submit
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch and check the release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          for zip in dist/*.zip; do
            gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      # Only per-version fields: the AMO listing itself is edited in the Developer Hub,
      # so a release never overwrites it.
      - name: AMO release notes and notes to reviewers
        run: node scripts/release-notes.ts "${TAG#v}" --amo > dist/amo-version.json

      - name: Submit
        env:
          # The Chrome Web Store's v1.1 API stopped working on 15 October 2026; v2 needs a service account.
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_PUBLISH_TYPE: ${{ vars.CHROME_PUBLISH_TYPE }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_AMO_METADATA_FILE: dist/amo-version.json
          # Partner Center › Publish API. The key expires; make a new one there before it does.
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          args="--chrome-zip dist/threadcrate-chrome.zip"
          if [ -n "$FIREFOX_EXTENSION_ID" ]; then
            args="$args --firefox-zip dist/threadcrate-firefox.zip --firefox-sources-zip dist/threadcrate-sources.zip"
          fi
          if [ -n "$EDGE_PRODUCT_ID" ]; then args="$args --edge-zip dist/threadcrate-edge.zip"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          pnpm exec wxt submit $args
