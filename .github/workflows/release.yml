# Builds every package for a version tag and drafts a GitHub release. Nothing is published:
# jasp reviews the draft and publishes it, which then starts submit.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']
  # A dry run: build and check everything, draft nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # typecheck, lint (ESLint and Prettier), unit tests, e2e against the mock reddit.com.
      - run: pnpm verify
      - run: pnpm check:manifest

      - name: Check the tag, the branch and the notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json $version"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Releases come from main"; exit 1; }
          mkdir -p dist
          node scripts/release-notes.ts "$version" > dist/notes.md

      - run: pnpm zip && pnpm zip:firefox

      # Reviewers find the build steps at the root of the source package. (Adding
      # SOURCE_CODE_REVIEW.md to zip.includeSources in wxt.config.ts makes this a no-op.)
      - name: Put SOURCE_CODE_REVIEW.md in the sources zip
        run: zip -q -j .output/*-sources.zip SOURCE_CODE_REVIEW.md

      - name: Rebuild from the sources zip, without git, as a store reviewer would
        run: |
          src="$RUNNER_TEMP/src"
          mkdir -p "$src" && unzip -q .output/*-sources.zip -d "$src"
          (cd "$src" && pnpm install --frozen-lockfile && pnpm build:firefox && pnpm build)
          diff -r "$src/.output/firefox-mv3" .output/firefox-mv3
          diff -r "$src/.output/chrome-mv3" .output/chrome-mv3

      # Edge runs the Chrome build: the manifest and code are the same for both
      # (wxt.config.ts targets chrome and firefox only).
      - name: Name the packages the same for every version
        run: |
          mkdir -p dist
          cp .output/*-chrome.zip dist/threadcrate-chrome.zip
          cp .output/*-chrome.zip dist/threadcrate-edge.zip
          cp .output/*-firefox.zip dist/threadcrate-firefox.zip
          cp .output/*-sources.zip dist/threadcrate-sources.zip
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\nInstall from your browser'"'"'s store to get updates. The zips are for store reviewers and testing.\n' >> dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
