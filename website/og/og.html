<!doctype html>
<!-- The social preview (public/og.png): open at 1200x630 and screenshot. -->
<html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Gabarito; font-weight: 400 900; src: url('../../public/fonts/gabarito-latin.woff2') format('woff2'); }
@font-face { font-family: Figtree; font-weight: 300 900; src: url('../../public/fonts/figtree-latin.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #fff; color: #14202f; font-family: Figtree, sans-serif; display: grid; grid-template-columns: 640px 1fr; overflow: hidden; }
.text { padding: 64px 48px 56px 72px; display: grid; align-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font: 800 28px/1 Gabarito, sans-serif; letter-spacing: -0.01em; }
.brand span { font: 500 26px/1 Figtree, sans-serif; color: #5f6978; }
.brand svg { width: 48px; height: 48px; }
h1 { font: 800 84px/0.94 Gabarito, sans-serif; letter-spacing: -0.045em; }
p { font-size: 26px; line-height: 1.35; color: #3f4a5a; max-width: 20em; }
.stage { margin: 48px 48px 48px 0; border-radius: 36px; background: #d93a00; display: grid; place-items: center; }
.card { width: 420px; border-radius: 26px; background: #fff; padding: 30px 32px; box-shadow: 0 30px 70px rgba(20,32,47,.35); }
.top { display: grid; grid-template-columns: 80px 1fr; gap: 18px; align-items: center; }
.top svg { width: 80px; height: 80px; }
.top svg g { stroke: #29b36f; }
.pct { font: 800 50px/1 Gabarito, sans-serif; color: #16704a; letter-spacing: -0.03em; }
.name { font: 700 21px/1.25 Gabarito, sans-serif; margin-top: 6px; white-space: nowrap; }
.count { font-size: 17px; color: #3f4a5a; }
.bar { height: 10px; border-radius: 99px; background: #29b36f; margin: 24px 0 18px; }
ul { list-style: none; padding: 0; display: grid; gap: 10px; font-size: 18px; color: #3f4a5a; }
li { display: flex; gap: 10px; align-items: center; }
li svg { width: 18px; height: 18px; flex: none; }
code { font: 600 17px ui-monospace, Menlo, monospace; color: #14202f; }
</style></head><body>
<div class="text">
  <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><rect width="128" height="128" rx="28" fill="#ff4500"/><g transform="translate(64 64) scale(0.78) translate(-64 -64)" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M69.44 12.28 A52 52 0 0 1 85.15 16.50 M100.77 27.23 A52 52 0 0 1 100.77 27.23 M111.50 42.85 A52 52 0 0 1 115.72 58.56 M114.23 77.46 A52 52 0 0 1 114.23 77.46 M106.07 94.56 A52 52 0 0 1 94.56 106.07 M77.46 114.23 A52 52 0 0 1 77.46 114.23 M58.56 115.72 A52 52 0 0 1 42.85 111.50 M27.23 100.77 A52 52 0 0 1 27.23 100.77 M16.50 85.15 A52 52 0 0 1 12.28 69.44 M13.77 50.54 A52 52 0 0 1 13.77 50.54 M21.93 33.44 A52 52 0 0 1 33.44 21.93 M50.54 13.77 A52 52 0 0 1 50.54 13.77"/><path d="M64 26 V60 M52 48 L64 60 L76 48 M38 68 V90 Q38 98 46 98 H82 Q90 98 90 90 V68 M54 82 H74"/></g></svg>Threadcrate <span>for Reddit</span></div>
  <h1>Keep the whole thread</h1>
  <p>A free browser extension. Reddit threads, subreddits and profiles as CSV, JSON and Markdown.</p>
</div>

</div></div>
</body></html>
